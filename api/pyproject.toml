[project]
name = "fitradeoff-api"
version = "0.3.0"
description = "API HTTP do metodo FITradeoff"
requires-python = ">=3.13"
dependencies = [
    # o extra traz o driver do PostgreSQL, usado quando FITRADEOFF_DATABASE_URL
    # estiver definida; sem ela, nada dele e importado
    "fitradeoff[postgres]",
    "fitradeoff-mcp",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    # Verificacao da assercao de identidade da aplicacao da frente. Chega por
    # tabela via `mcp`, mas depender disso seria depender do acaso.
    "pyjwt[crypto]>=2.8",
    "anthropic>=1.0",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    # /metrics para o Prometheus da FasorX, numa porta a parte. Ver metricas.py.
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
