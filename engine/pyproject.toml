[project]
name = "fitradeoff"
version = "0.2.0"
description = "Motor do metodo FITradeoff - escolha, ranking, sorting e carteiras"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "highspy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# So para quem guarda as decisoes no PostgreSQL (FITRADEOFF_DATABASE_URL).
postgres = ["psycopg[binary]>=3.2", "psycopg-pool>=3.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
