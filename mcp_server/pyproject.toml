[project]
name = "fitradeoff-mcp"
version = "0.1.0"
description = "Servidor MCP do metodo FITradeoff"
requires-python = ">=3.11"
dependencies = ["fitradeoff", "mcp>=2.0"]

[project.scripts]
fitradeoff-mcp = "fitradeoff_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
